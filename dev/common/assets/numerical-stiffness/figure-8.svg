<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">Ball contacting table</title>
  <desc id="desc">Clean vector redraw for the numerical-stiffness paper.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20252b"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#236a9a"/>
    </marker>
    
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20252b; font-size: 17px; }
    .small { font-size: 14px; }
    .label { font-size: 18px; font-weight: 600; }
    .panel-title { font-size: 17px; font-weight: 600; }
    .axis { stroke: #20252b; stroke-width: 2.2; fill: none; }
    .tick { stroke: #20252b; stroke-width: 1.2; }
    .guide { stroke: #5f6b76; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
    .curve { stroke: #236a9a; stroke-width: 2.5; fill: none; }
    .region { fill: #dcebf4; stroke: #236a9a; stroke-width: 2.2; }
    .point { stroke: #20252b; stroke-width: 3; }
  </style>
  <line x1="70.00" y1="285.00" x2="655.00" y2="285.00" class="axis"/>
<line x1="175.00" y1="285.00" x2="175.00" y2="190.00" class="axis" marker-end="url(#arrow)"/>
<text x="650.00" y="272.00" text-anchor="end" class="label">x</text>
<text x="191.00" y="205.00" text-anchor="start" class="label">y</text>
<circle cx="470" cy="230" r="72" fill="#f5f8fa" stroke="#20252b" stroke-width="2.5"/>
<line x1="470.00" y1="230.00" x2="470.00" y2="285.00" class="guide"/>
<line x1="470.00" y1="230.00" x2="535.00" y2="230.00" class="guide"/>
<text x="507.00" y="218.00" text-anchor="start" class="label">r</text>
<text x="488.00" y="319.00" text-anchor="start" class="label">d = y − r</text>
<line x1="490.00" y1="230.00" x2="490.00" y2="277.00" class="axis" marker-end="url(#arrow)"/>
<text x="504.00" y="264.00" text-anchor="start" class="label">mg</text>
<line x1="460.00" y1="390.00" x2="460.00" y2="291.00" class="curve" marker-end="url(#blue-arrow)"/>
<text x="445.00" y="407.00" text-anchor="middle" class="label">F</text>
</svg>
