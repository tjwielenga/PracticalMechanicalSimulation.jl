<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Eigenvalue movement</title>
  <desc id="desc">Clean vector redraw for the numerical-stiffness paper.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20252b"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#236a9a"/>
    </marker>
    
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20252b; font-size: 17px; }
    .small { font-size: 14px; }
    .label { font-size: 18px; font-weight: 600; }
    .panel-title { font-size: 17px; font-weight: 600; }
    .axis { stroke: #20252b; stroke-width: 2.2; fill: none; }
    .tick { stroke: #20252b; stroke-width: 1.2; }
    .guide { stroke: #5f6b76; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
    .curve { stroke: #236a9a; stroke-width: 2.5; fill: none; }
    .region { fill: #dcebf4; stroke: #236a9a; stroke-width: 2.2; }
    .point { stroke: #20252b; stroke-width: 3; }
  </style>
  <circle cx="430" cy="250" r="120" fill="none" stroke="#236a9a" stroke-width="2.5"/>
<line x1="65.00" y1="250.00" x2="655.00" y2="250.00" class="axis"/>
<line x1="430.00" y1="440.00" x2="430.00" y2="60.00" class="axis"/>
<text x="650.00" y="236.00" text-anchor="end" class="label">Real hλ</text>
<text x="444.00" y="78.00" text-anchor="start" class="label">Imaginary hλ</text>
<path d="M 107.00 167.00 L 123.00 183.00 M 107.00 183.00 L 123.00 167.00" stroke="#20252b" stroke-width="3" fill="none"/>
<line x1="127.00" y1="175.00" x2="422.00" y2="250.00" class="curve" marker-end="url(#blue-arrow)"/>
<path d="M 107.00 327.00 L 123.00 343.00 M 107.00 343.00 L 123.00 327.00" stroke="#20252b" stroke-width="3" fill="none"/>
<line x1="127.00" y1="335.00" x2="422.00" y2="250.00" class="curve" marker-end="url(#blue-arrow)"/>
<path d="M 422.00 242.00 L 438.00 258.00 M 422.00 258.00 L 438.00 242.00" stroke="#236a9a" stroke-width="3" fill="none"/>
<text x="180.00" y="418.00" text-anchor="start" class="small">decreasing h moves hλ toward the origin</text>
</svg>
