<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Ball above table</title>
  <desc id="desc">Clean vector redraw for the numerical-stiffness paper.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20252b"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#236a9a"/>
    </marker>
    
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20252b; font-size: 17px; }
    .small { font-size: 14px; }
    .label { font-size: 18px; font-weight: 600; }
    .panel-title { font-size: 17px; font-weight: 600; }
    .axis { stroke: #20252b; stroke-width: 2.2; fill: none; }
    .tick { stroke: #20252b; stroke-width: 1.2; }
    .guide { stroke: #5f6b76; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
    .curve { stroke: #236a9a; stroke-width: 2.5; fill: none; }
    .region { fill: #dcebf4; stroke: #236a9a; stroke-width: 2.2; }
    .point { stroke: #20252b; stroke-width: 3; }
  </style>
  <line x1="80.00" y1="345.00" x2="650.00" y2="345.00" class="axis"/>
<line x1="335.00" y1="345.00" x2="335.00" y2="255.00" class="axis" marker-end="url(#arrow)"/>
<text x="650.00" y="332.00" text-anchor="end" class="label">x</text>
<text x="351.00" y="270.00" text-anchor="start" class="label">y</text>
<circle cx="335" cy="135" r="62" fill="#f5f8fa" stroke="#20252b" stroke-width="2.5"/>
<line x1="335.00" y1="135.00" x2="335.00" y2="215.00" class="axis" marker-end="url(#arrow)"/>
<text x="349.00" y="175.00" text-anchor="start" class="label">mg</text>
<line x1="400.00" y1="150.00" x2="480.00" y2="195.00" class="curve" marker-end="url(#blue-arrow)"/>
<text x="488.00" y="205.00" text-anchor="start" class="label">v</text>
</svg>
