<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy region</title>
  <desc id="desc">Clean vector redraw for the numerical-stiffness paper.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20252b"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#236a9a"/>
    </marker>
    
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20252b; font-size: 17px; }
    .small { font-size: 14px; }
    .label { font-size: 18px; font-weight: 600; }
    .panel-title { font-size: 17px; font-weight: 600; }
    .axis { stroke: #20252b; stroke-width: 2.2; fill: none; }
    .tick { stroke: #20252b; stroke-width: 1.2; }
    .guide { stroke: #5f6b76; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
    .curve { stroke: #236a9a; stroke-width: 2.5; fill: none; }
    .region { fill: #dcebf4; stroke: #236a9a; stroke-width: 2.2; }
    .point { stroke: #20252b; stroke-width: 3; }
  </style>
  <circle cx="310" cy="250" r="155" class="region"/>
<line x1="65.00" y1="250.00" x2="560.00" y2="250.00" class="axis"/>
<line x1="310.00" y1="455.00" x2="310.00" y2="45.00" class="axis"/>
<text x="555.00" y="235.00" text-anchor="end" class="label">Real hλ</text>
<text x="326.00" y="65.00" text-anchor="start" class="label">Imaginary hλ</text>
<line x1="310.00" y1="250.00" x2="194.81" y2="146.28" class="curve" marker-end="url(#blue-arrow)"/>
<text x="244.41" y="188.14" text-anchor="middle" class="label">Rₖ</text>
<path d="M 212.00 186.00 L 224.00 198.00 M 212.00 198.00 L 224.00 186.00" stroke="#20252b" stroke-width="3" fill="none"/>
<path d="M 216.00 310.00 L 228.00 322.00 M 216.00 322.00 L 228.00 310.00" stroke="#20252b" stroke-width="3" fill="none"/>
</svg>
