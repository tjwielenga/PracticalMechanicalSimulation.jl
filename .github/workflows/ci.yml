name: Smoke test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'paper/**'
      - 'apps/SimpViewWeb/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'paper/**'
      - 'apps/SimpViewWeb/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  julia-smoke:
    name: Julia smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Load package
        run: julia --project=. -e 'import PracticalMechanicalSimulation'
      - name: Run smoke test
        run: julia --project=. test/runtests.jl smoke
