name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  julia:
    name: Julia 1.12 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Load package
        run: julia --project=. -e 'import PracticalMechanicalSimulation'
      - name: Test supported program
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  simpview-web:
    name: SimpView Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/SimpViewWeb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/SimpViewWeb/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
