[model]
name = "translational_joint"
title = "Spatial translational joint"
dimension = "spatial"

[analysis]
mode = "automatic"

[state_selection]
method = "preferred"
preferred_velocities = ["slider_joint.velocity"]
allow_fallback = false

[simulation]
start_time = 0.0
end_time = 1.0
output_samples = 61
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-6
maximum_step = 0.02

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.axis]
type = "marker"

[ground.axis.graphics]
shape = "xy_frame"
axis_length = 0.30
plane_size = 0.16
plane_color = "gray70"
opacity = 0.18
label = "translation axis"

[slider]
type = "rigid_body"
mass = 1.0
inertia = [0.015, 0.020, 0.025]
position = [0.0, 0.0, 1.0]

[slider.graphics]
shape = "box"
size = [0.30, 0.22, 0.20]
color = "steelblue"

[slider.center]
type = "marker"

[slider_joint]
type = "translational"
markers = ["slider.center", "ground.axis"]
translation_coordinates = true

[gravity]
type = "gravity"
acceleration = [0.0, 0.0, -9.81]
bodies = ["slider"]
