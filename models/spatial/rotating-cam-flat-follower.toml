[model]
name = "spatial_rotating_cam_flat_follower"
title = "Spatial extruded cam and flat follower"
dimension = "spatial"

[analysis]
mode = "dynamic"

[state_selection]
method = "preferred"
preferred_velocities = ["follower_guide.velocity"]
allow_fallback = true

[simulation]
start_time = 0.0
end_time = 0.942477796076938
output_samples = 61
relative_tolerance = 1.0e-6
absolute_tolerance = 1.0e-8
initial_step = 1.0e-6
maximum_step = 0.005

[graphics]
background = "white"

[ground]
type = "ground"

[ground.cam_bearing]
type = "marker"

[ground.guide]
type = "marker"
orientation = ["-90 deg", 1.0, 0.0, 0.0]

[cam]
type = "rigid_body"
mass = 1.0
inertia = [0.02, 0.02, 0.02]

[cam.graphics]
show_default = false

[cam.center]
type = "marker"

[cam.profile_frame]
type = "marker"

[cam_profile]
type = "curve"
marker = "cam.profile_frame"
closed = true
half_width = 0.05
points = [
    [ 0.2000,  0.0000], [ 0.1848,  0.0995],
    [ 0.1414,  0.1838], [ 0.0765,  0.2402],
    [ 0.0000,  0.2600], [-0.0765,  0.2402],
    [-0.1414,  0.1838], [-0.1848,  0.0995],
    [-0.2000,  0.0000], [-0.1848, -0.0995],
    [-0.1414, -0.1838], [-0.0765, -0.2402],
    [ 0.0000, -0.2600], [ 0.0765, -0.2402],
    [ 0.1414, -0.1838], [ 0.1848, -0.0995],
]

[follower]
type = "rigid_body"
mass = 1.0
inertia = [0.0025, 0.0025, 0.0025]
position = [0.0, 0.3097947, 0.0]

[follower.graphics]
show_default = false

[follower.face]
type = "marker"
position = [0.0, -0.05, 0.0]

[follower.guide]
type = "marker"
orientation = ["-90 deg", 1.0, 0.0, 0.0]

[cam_bearing]
type = "revolute"
markers = ["cam.center", "ground.cam_bearing"]

[follower_guide]
type = "inline"
markers = ["follower.guide", "ground.guide"]
translation_coordinates = true

[follower_orientation]
type = "orient"
markers = ["follower.guide", "ground.guide"]

[cam_drive]
type = "rotational_motion"
joint = "cam_bearing"
function = "constant_speed"
initial_angle = 0.0
angular_velocity = 10.0

[flat_contact]
type = "flat_follower_contact"
curve = "cam_profile"
follower_marker = "follower.face"
stiffness = 50000.0
damping_factor = 10.0
transition_depth = 0.00002

[gravity]
type = "gravity"
bodies = ["follower"]
acceleration = [0.0, -9.81, 0.0]
