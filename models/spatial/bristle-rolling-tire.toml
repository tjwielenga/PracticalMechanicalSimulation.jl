[model]
name = "bristle_rolling_tire"
title = "Driven wheel with load-dependent tire bristle friction"
dimension = "spatial"

[analysis]
mode = "dynamic"

[simulation]
end_time = 2.0
output_samples = 121
relative_tolerance = 1.0e-7
absolute_tolerance = 1.0e-9
initial_step = 1.0e-7
maximum_step = 0.005

[graphics]
background = "white"
body_palette = "colorblind"

[ground]
type = "ground"

[ground.road]
type = "marker"

[ground.road.graphics]
shape = "xy_frame"
axis_length = 0.45
plane_size = 0.30
plane_color = "gray65"
opacity = 0.18
label = "road frame"

[ground.track]
type = "marker"
position = [0.0, 0.0, 0.49]

[spindle]
type = "rigid_body"
mass = 4.0
inertia = [0.08, 0.08, 0.08]
position = [0.0, 0.0, 0.49]
velocity = [0.0, 0.60, 0.0]

[spindle.graphics]
shape = "box"
marker = "spindle.center"
size = [0.22, 0.16, 0.12]
color = "darkorange"

[spindle.center]
type = "marker"

[spindle.track]
type = "marker"

[spindle.hub]
type = "marker"
orientation = ["-90 deg", 1.0, 0.0, 0.0]

[road_plane]
type = "inplane"
markers = ["spindle.track", "ground.track"]

[track_orientation]
type = "orient"
markers = ["spindle.track", "ground.track"]

[wheel]
type = "rigid_body"
mass = 6.0
inertia = [0.76, 0.38, 0.76]
position = [0.0, 0.0, 0.49]
velocity = [0.0, 0.60, 0.0]

[wheel.graphics]
shape = "cylinder"
axis = "y"
length = 0.20
radius = 0.50
color = "steelblue"
opacity = 0.80

[wheel.center]
type = "marker"
orientation = ["-90 deg", 1.0, 0.0, 0.0]

[wheel.hub]
type = "marker"
orientation = ["-90 deg", 1.0, 0.0, 0.0]

[wheel.rim]
type = "marker"
position = [0.42, 0.0, 0.0]

[axle]
type = "revolute"
markers = ["wheel.hub", "spindle.hub"]
rotation_coordinates = true

[drive]
type = "applied_torque"
joint = "axle"
torque = 6.0

[tire]
type = "rolling_tire"
markers = ["wheel.center", "ground.road"]
radius = 0.50
normal_stiffness = 15000.0
normal_damping_time_scale = 0.015
tangential_model = "bristle"
# Illustrative load curves, not measured tire data. Rows are [N, m] and
# [N, N/radian] (or [N, N/unit slip ratio]) respectively.
patch_length_by_load = [[0, 0], [3000, 0.22], [6000, 0.29]]
cornering_stiffness_by_load = [[0, 0], [3000, 45000], [6000, 70000]]
longitudinal_slip_stiffness_by_load = [[0, 0], [3000, 60000], [6000, 95000]]
lateral_relaxation_fraction = 1.0
longitudinal_relaxation_fraction = 1.0
shear_release_time = 0.01
mu_longitudinal = 0.90
mu_lateral = 0.80
