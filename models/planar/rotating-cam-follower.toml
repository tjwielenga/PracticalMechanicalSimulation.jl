[model]
name = "rotating_cam_follower"
title = "Rotating cam and circular roller follower"
dimension = "planar"

[analysis]
mode = "dynamic"

[state_selection]
method = "preferred"
preferred_velocities = ["follower.V_y"]
allow_fallback = true

[simulation]
start_time = 0.0
end_time = 0.942477796076938
output_samples = 61
relative_tolerance = 1.0e-6
absolute_tolerance = 1.0e-8
initial_step = 1.0e-6
maximum_step = 0.005

[graphics]
background = "white"

[ground]
type = "ground"

[ground.cam_bearing]
type = "marker"

[ground.follower_guide]
type = "marker"
orientation = "90 deg"

[cam]
type = "rigid_body"
mass = 1.0
inertia = 0.02

[cam.graphics]
show_default = false

[cam.center]
type = "marker"

[cam.profile_frame]
type = "marker"

[cam_profile]
type = "curve"
marker = "cam.profile_frame"
closed = true
points = [
    [ 0.2000,  0.0000],
    [ 0.1848,  0.0995],
    [ 0.1414,  0.1838],
    [ 0.0765,  0.2402],
    [ 0.0000,  0.2600],
    [-0.0765,  0.2402],
    [-0.1414,  0.1838],
    [-0.1848,  0.0995],
    [-0.2000,  0.0000],
    [-0.1848, -0.0995],
    [-0.1414, -0.1838],
    [-0.0765, -0.2402],
    [ 0.0000, -0.2600],
    [ 0.0765, -0.2402],
    [ 0.1414, -0.1838],
    [ 0.1848, -0.0995],
]

[follower]
type = "rigid_body"
mass = 1.0
inertia = 0.0025
position = [0.0, 0.3097947]
orientation = "90 deg"

[follower.graphics]
show_default = false

[follower.center]
type = "marker"

[cam_bearing]
type = "revolute"
markers = ["cam.center", "ground.cam_bearing"]

[follower_guide]
type = "translational"
markers = ["follower.center", "ground.follower_guide"]

[cam_drive]
type = "rotational_motion"
markers = ["cam.center", "ground.cam_bearing"]
function = "constant_speed"
initial_angle = 0.0
angular_velocity = 10.0

[roller_contact]
type = "curve_contact"
curve = "cam_profile"
roller_marker = "follower.center"
radius = 0.05
stiffness = 50000.0
damping_factor = 10.0
transition_depth = 0.00002

[gravity]
type = "gravity"
bodies = ["follower"]
acceleration = [0.0, -9.81]
